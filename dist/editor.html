<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사업 2회차 · LIVE EDITOR</title><style>
*{box-sizing:border-box}body{margin:0;background:#15151b;color:#ecebf1;font:15px system-ui}header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #37333f}h1{font-size:19px;margin:0}small{color:#aaa5b3}button,select{font:inherit;border:1px solid #49424f;border-radius:7px;background:#29252f;color:inherit;padding:9px 12px;cursor:pointer}button.active{background:#cfe08a;color:#20231c;border-color:#cfe08a}.toolbar{display:flex;gap:8px;align-items:center}.layout{height:calc(100vh - 76px);display:grid;grid-template-columns:420px 1fr}.editor{border-right:1px solid #37333f;display:flex;flex-direction:column;min-height:0}.tabs{padding:14px;display:flex;gap:7px}.panel{flex:1;overflow:auto;padding:0 14px 14px}.panel[hidden]{display:none}textarea{width:100%;height:100%;resize:none;background:#1b1922;color:#e3dce9;border:1px solid #393240;padding:14px;font:13px/1.7 monospace;tab-size:2;outline:none}textarea:focus{border-color:#b99bd0}.swatches{display:grid;grid-template-columns:1fr 1fr;gap:10px}.swatch{background:#25212c;padding:10px;border-radius:8px;display:flex;align-items:center;gap:10px}.swatch input{width:42px;height:42px;border:0;background:transparent;cursor:pointer}.swatch span{font:13px monospace;color:#b8b0c1}.swatch b{display:block;color:#eee;font-size:14px;margin-bottom:3px}.hint{color:#aaa3b1;font-size:13px;line-height:1.7;margin:0 0 14px}.preview{min-width:0;display:flex;flex-direction:column;background:#25212b}.previewbar{padding:14px 18px;display:flex;justify-content:space-between;gap:10px;align-items:center}#stage{flex:1;overflow:auto;display:flex;justify-content:center;padding:0 18px 18px}iframe{background:white;border:0;width:100%;height:100%;min-height:400px;box-shadow:0 8px 30px #0004}footer{font-size:13px;color:#a9a1b2;padding:10px 16px;border-top:1px solid #37333f}#status{color:#cfe08a;font-size:13px}@media(max-width:850px){.layout{grid-template-columns:1fr;height:auto}.editor{height:500px}.preview{height:800px}header{height:auto;padding:15px;gap:12px;flex-wrap:wrap}.toolbar{flex-wrap:wrap}}
</style><header><div><h1>사업 2회차 <small> / LIVE EDITOR</small></h1><small>HTML · CSS · 팔레트 실시간 미리보기</small></div><div class="toolbar"><span id="status">불러오는 중…</span><button id="reset">원본으로</button><button id="download">HTML 내보내기</button></div></header><main class="layout"><section class="editor"><nav class="tabs"><button class="active" data-tab="palette">팔레트</button><button data-tab="css">CSS</button><button data-tab="html">HTML</button></nav><div class="panel" id="palette"><p class="hint">색상을 바꾸면 오른쪽 화면에 바로 반영됩니다.<br>수정 내용은 이 브라우저에 자동 저장됩니다.</p><div class="swatches" id="swatches"></div></div><div class="panel" id="css" hidden><textarea id="cssCode" aria-label="CSS 코드" spellcheck="false"></textarea></div><div class="panel" id="html" hidden><p class="hint">HTML 수정은 화면 편집 모드에 적용됩니다. 게임의 React 실행 코드는 별도로 보존됩니다.</p><textarea id="htmlCode" aria-label="HTML 코드" spellcheck="false" style="height:calc(100% - 65px)"></textarea></div><footer>CSS는 즉시 적용 · HTML은 입력 후 0.4초 뒤 반영</footer></section><section class="preview"><div class="previewbar"><div class="toolbar"><button id="design" class="active">화면 편집</button><button id="play">게임 실행</button></div><select id="width" aria-label="미리보기 너비"><option value="100%">화면에 맞춤</option><option value="390px">모바일 390px</option><option value="768px">태블릿 768px</option><option value="1280px">데스크톱 1280px</option></select></div><div id="stage"><iframe id="frame" title="실시간 게임 미리보기" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe></div></section></main><script src="editor.js"></script></html>
